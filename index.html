
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>AI Sports Predictor</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 60px;
      background: #0b1020;
      color: #f5f7ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      max-width: 760px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 32px 0 30px;
    }

    h1 {
      color: #5dbbff;
      font-size: clamp(25px, 7vw, 38px);
      margin: 0 0 15px;
    }

    .subtitle, .muted {
      color: #9ca8bd;
    }

    .sports {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 24px 0;
    }

    .sport {
      border: 1px solid #39465d;
      border-radius: 13px;
      padding: 18px 8px;
      color: white;
      background: #202a3c;
      font-size: 17px;
      cursor: pointer;
    }

    .sport.active {
      background: #126da3;
      border-color: #5dbbff;
    }

    .panel {
      background: #202a3c;
      border-radius: 20px;
      padding: 22px 18px;
      margin-top: 18px;
    }

    h2 {
      font-size: 23px;
      margin: 0 0 12px;
    }

    .match {
      background: #151e30;
      border-radius: 14px;
      padding: 18px 14px;
      margin-top: 18px;
    }

    .date {
      color: #aebad0;
      font-size: 13px;
      text-align: center;
    }

    .teams {
      font-size: 19px;
      font-weight: 700;
      text-align: center;
      line-height: 1.5;
      margin: 12px 0 18px;
    }

    .probabilities {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .prob {
      background: #0b1020;
      border-radius: 11px;
      padding: 14px 4px;
      text-align: center;
      min-width: 0;
    }

    .prob span {
      display: block;
      margin-bottom: 7px;
      color: #dce7f7;
    }

    .prob strong {
      display: block;
      color: #5dbbff;
      font-size: clamp(17px, 5vw, 23px);
    }

    .section-title {
      color: #dce7f7;
      font-size: 14px;
      font-weight: 700;
      margin: 18px 0 10px;
    }

    .odds-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .odd {
      background: #27354a;
      border: 1px solid #40516a;
      border-radius: 11px;
      padding: 12px 4px;
      text-align: center;
      min-width: 0;
    }

    .odd span {
      display: block;
      color: #c7d5e9;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .odd strong {
      display: block;
      color: #ffd37a;
      font-size: 21px;
    }

    .bookmaker {
      color: #aebad0;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 10px;
      text-align: center;
    }

    .comparison {
      background: #101b2d;
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
    }

    .comparison-row {
      display: grid;
      grid-template-columns: 26px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
    }

    .comparison-row strong {
      font-variant-numeric: tabular-nums;
    }

    .positive { color: #71d9ac; }
    .negative { color: #ff9a9a; }

    .small {
      font-size: 12px;
      color: #aebad0;
      line-height: 1.5;
    }

    .notice {
      margin-top: 20px;
      color: #ffca55;
      line-height: 1.6;
      font-size: 14px;
    }

    .status {
      color: #aebad0;
      line-height: 1.6;
    }

    .updated {
      font-size: 13px;
      color: #aebad0;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      margin-top: 35px;
      color: #738198;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏆 AI SPORTS PREDICTOR</h1>
      <p class="subtitle">Inteligentna analiza sportowa</p>
    </header>

    <div class="sports">
      <button class="sport active"
              onclick="showSport('football', this)">
        ⚽ Piłka nożna
      </button>
      <button class="sport"
              onclick="showSport('volleyball', this)">
        🏐 Siatkówka
      </button>
      <button class="sport"
              onclick="showSport('basketball', this)">
        🏀 Koszykówka
      </button>
      <button class="sport"
              onclick="showSport('tennis', this)">
        🎾 Tenis
      </button>
    </div>

    <section class="panel" id="content">
      <h2>⚽ Prognozy Premier League</h2>
      <p class="status">Ładowanie prognoz...</p>
    </section>

    <footer>
      AI Sports Predictor • Model eksperymentalny
    </footer>
  </div>

  <script>
    const content = document.getElementById("content");

    const sportNames = {
      volleyball: "🏐 Siatkówka",
      basketball: "🏀 Koszykówka",
      tennis: "🎾 Tenis"
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]
      );
    }

    function formatDate(value) {
      if (!value) return "Brak daty";

      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return "Data nieznana";
      }

      return date.toLocaleString("pl-PL", {
        timeZone: "Europe/Warsaw",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function percentage(value) {
      if (value === null || value === undefined || value === "") {
        return "–";
      }

      const number = Number(value);

      return Number.isFinite(number)
        ? number.toFixed(1).replace(".", ",") + "%"
        : "–";
    }

    function formatOdd(value) {
      const number = Number(value);

      return Number.isFinite(number) && number > 1
        ? number.toFixed(2).replace(".", ",")
        : "–";
    }

    function validOdds(odds) {
      if (!odds) return false;

      return ["home", "draw", "away"].every(key => {
        const value = Number(odds[key]);
        return Number.isFinite(value) && value > 1;
      });
    }

    function renderComparison(probabilities, odds) {
      if (!validOdds(odds)) return "";

      const keys = [
        ["home", "1"],
        ["draw", "X"],
        ["away", "2"]
      ];

      const total = keys.reduce(
        (sum, [key]) => sum + 1 / Number(odds[key]),
        0
      );

      if (total <= 0) return "";

      const rows = keys.map(([key, label]) => {
        const ai = Number(probabilities[key]);
        const market = (1 / Number(odds[key])) / total * 100;

        if (!Number.isFinite(ai)) return "";

        const difference = ai - market;
        const sign = difference > 0 ? "+" : "";
        const cssClass = difference >= 0
          ? "positive"
          : "negative";

        return `
          <div class="comparison-row">
            <strong>${label}</strong>
            <span>
              AI ${percentage(ai)}
              · rynek ${percentage(market)}
            </span>
            <strong class="${cssClass}">
              ${sign}${percentage(difference)}
            </strong>
          </div>
        `;
      }).join("");

      return `
        <div class="comparison">
          <div class="section-title" style="margin-top:0">
            📊 AI kontra rynek
          </div>
          ${rows}
          <p class="small">
            Różnica w punktach procentowych.
            Prawdopodobieństwa rynkowe są
            znormalizowane po usunięciu marży.
            Dodatnia różnica nie oznacza
            gwarantowanego zysku.
          </p>
        </div>
      `;
    }

    function renderOdds(match) {
      const odds = match.odds;

      if (!validOdds(odds)) {
        return `
          <p class="small">
            Kursy bukmacherskie obecnie niedostępne.
          </p>
        `;
      }

      return `
        <div class="section-title">
          💰 Kursy bukmacherskie
        </div>

        <div class="odds-grid">
          <div class="odd">
            <span>1</span>
            <strong>${formatOdd(odds.home)}</strong>
          </div>

          <div class="odd">
            <span>X</span>
            <strong>${formatOdd(odds.draw)}</strong>
          </div>

          <div class="odd">
            <span>2</span>
            <strong>${formatOdd(odds.away)}</strong>
          </div>
        </div>

        <div class="bookmaker">
          Bukmacher:
          ${escapeHTML(odds.bookmaker || "Nieznany")}
          ${odds.updated_at
            ? `<div>Aktualizacja kursów:
                ${escapeHTML(formatDate(odds.updated_at))}
               </div>`
            : ""}
        </div>

        ${renderComparison(match.probabilities || {}, odds)}
      `;
    }

    async function loadFootball() {
      content.innerHTML = `
        <h2>⚽ Prognozy Premier League</h2>
        <p class="status">Ładowanie prognoz...</p>
      `;

      try {
        const response = await fetch(
          "./predictions.json?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Nie można pobrać prognoz");
        }

        const data = await response.json();

        if (!Array.isArray(data.predictions)) {
          throw new Error("Nieprawidłowy format danych");
        }

        if (!data.predictions.length) {
          content.innerHTML = `
            <h2>⚽ Prognozy Premier League</h2>
            <p class="status">
              Brak dostępnych prognoz na najbliższe mecze.
            </p>
          `;
          return;
        }

        const matches = data.predictions.map(match => {
          const p = match.probabilities || {};

          return `
            <article class="match">
              <div class="date">
                ${escapeHTML(formatDate(match.date))}
              </div>

              <div class="teams">
                ${escapeHTML(match.home_team || "Gospodarze")}
                <div>vs</div>
                ${escapeHTML(match.away_team || "Goście")}
              </div>

              <div class="section-title">
                🤖 Prawdopodobieństwo AI
              </div>

              <div class="probabilities">
                <div class="prob">
                  <span>1</span>
                  <strong>${percentage(p.home)}</strong>
                </div>

                <div class="prob">
                  <span>X</span>
                  <strong>${percentage(p.draw)}</strong>
                </div>

                <div class="prob">
                  <span>2</span>
                  <strong>${percentage(p.away)}</strong>
                </div>
              </div>

              ${renderOdds(match)}
            </article>
          `;
        }).join("");

        content.innerHTML = `
          <h2>
            ⚽ ${escapeHTML(data.competition || "Premier League")}
          </h2>

          <p class="muted">
            Model: ${escapeHTML(data.model || "AI")}
          </p>

          <p class="updated">
            Aktualizacja danych:
            ${escapeHTML(formatDate(data.updated_at))}
          </p>

          ${matches}

          <p class="notice">
            ⚠️ Prognozy są eksperymentalne.
            Nie stanowią gwarancji wyniku ani
            rekomendacji zakładów.
            Kursy mogą się zmieniać.
          </p>
        `;
      } catch (error) {
        content.innerHTML = `
          <h2>⚽ Prognozy Premier League</h2>
          <p class="status">
            Nie udało się pobrać prognoz.
            Spróbuj odświeżyć aplikację później.
          </p>
        `;
      }
    }

    function showSport(sport, button) {
      document.querySelectorAll(".sport").forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");

      if (sport === "football") {
        loadFootball();
        return;
      }

      content.innerHTML = `
        <h2>${escapeHTML(sportNames[sport] || "Sport")}</h2>
        <p class="status">
          Przygotowujemy model i źródła danych
          dla tej dyscypliny.
        </p>
      `;
    }

    loadFootball();
  </script>
</body>
</html>
