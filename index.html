
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>AI Sports Predictor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    header { text-align: center; padding: 22px 0; }
    h1 { color: #38bdf8; font-size: 27px; }
    .subtitle { color: #94a3b8; font-size: 14px; }
    .sports {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 25px 0;
    }
    button {
      padding: 16px 8px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #1e293b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button.active {
      background: #0369a1;
      border-color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
    }
    h2 { font-size: 20px; }
    .muted { color: #94a3b8; }
    .match {
      font-size: 21px;
      font-weight: bold;
      text-align: center;
      margin: 24px 0;
    }
    .probabilities {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .prob {
      flex: 1;
      text-align: center;
      background: #0f172a;
      padding: 14px 5px;
      border-radius: 10px;
    }
    .prob strong {
      display: block;
      color: #38bdf8;
      font-size: 25px;
      margin-top: 8px;
    }
    .notice {
      color: #fbbf24;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 20px;
    }
    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 35px;
    }
  </style>
</head>
<body>

<header>
  <h1>🏆 AI SPORTS PREDICTOR</h1>
  <div class="subtitle">Inteligentna analiza sportowa</div>
</header>

<div class="sports">
  <button class="active" onclick="showSport('football',this)">⚽ Piłka nożna</button>
  <button onclick="showSport('volleyball',this)">🏐 Siatkówka</button>
  <button onclick="showSport('basketball',this)">🏀 Koszykówka</button>
  <button onclick="showSport('tennis',this)">🎾 Tenis</button>
</div>

<main id="content"></main>

<footer>AI Sports Predictor • Wersja demonstracyjna</footer>

<script>
const sections = {
  football: `
    <div class="card">
      <h2>⚽ Prognoza meczu</h2>
      <p class="muted">Przykładowa analiza modelu</p>
      <div class="match">Arsenal — Chelsea</div>
      <div class="probabilities">
        <div class="prob">1<br><strong>52%</strong></div>
        <div class="prob">X<br><strong>26%</strong></div>
        <div class="prob">2<br><strong>22%</strong></div>
      </div>
      <p class="notice">
        ⚠️ To dane demonstracyjne, a nie aktualna
        prognoza ani rekomendacja zakładu.
      </p>
    </div>
  `,
  volleyball: `
    <div class="card">
      <h2>🏐 Siatkówka</h2>
      <p class="muted">Moduł prognoz w przygotowaniu.</p>
    </div>
  `,
  basketball: `
    <div class="card">
      <h2>🏀 Koszykówka</h2>
      <p class="muted">Moduł prognoz w przygotowaniu.</p>
    </div>
  `,
  tennis: `
    <div class="card">
      <h2>🎾 Tenis</h2>
      <p class="muted">Moduł prognoz w przygotowaniu.</p>
    </div>
  `
};

function showSport(sport, button) {
  document.getElementById("content").innerHTML = sections[sport];
  document.querySelectorAll(".sports button").forEach(
    b => b.classList.remove("active")
  );
  button.classList.add("active");
}

showSport("football", document.querySelector(".sports button"));
</script>

</body>
</html>
