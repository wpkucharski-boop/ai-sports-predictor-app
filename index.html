
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>AI Sports Predictor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px 60px;
      background: #0b1020;
      color: #f5f7ff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 25px 0 20px;
    }

    h1 {
      color: #5dbbff;
      font-size: clamp(25px, 7vw, 38px);
      margin: 0 0 12px;
    }

    .subtitle,
    .muted {
      color: #9ca8bd;
    }

    .sports {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 22px 0;
    }

    .sport {
      border: 1px solid #39465d;
      border-radius: 13px;
      padding: 17px 7px;
      color: white;
      background: #202a3c;
      font-size: 16px;
      cursor: pointer;
    }

    .sport.active {
      background: #126da3;
      border-color: #5dbbff;
    }

    .panel {
      background: #202a3c;
      border-radius: 18px;
      padding: 20px 15px;
      margin-top: 18px;
    }

    h2 {
      font-size: 22px;
      margin: 0 0 12px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .summary-box {
      background: #151e30;
      border-radius: 12px;
      padding: 15px 8px;
      text-align: center;
    }

    .summary-box strong {
      display: block;
      color: #5dbbff;
      font-size: 27px;
    }

    .summary-box span {
      display: block;
      color: #aebad0;
      font-size: 12px;
      margin-top: 5px;
    }

    .filters {
      display: grid;
      gap: 10px;
      margin: 20px 0;
    }

    .filters select,
    .filters input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #43546e;
      border-radius: 10px;
      background: #101b2d;
      color: white;
      padding: 11px;
      font-size: 16px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #dce7f7;
      font-size: 14px;
      padding: 5px 0;
    }

    .check-row input {
      width: 19px;
      height: 19px;
      accent-color: #5dbbff;
    }

    .match {
      background: #151e30;
      border-radius: 14px;
      padding: 17px 12px;
      margin-top: 16px;
    }

    .league-label {
      color: #ffd37a;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
    }

    .date {
      color: #aebad0;
      font-size: 13px;
      text-align: center;
    }

    .teams {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      line-height: 1.5;
      margin: 12px 0 17px;
      overflow-wrap: anywhere;
    }

    .vs {
      color: #9ca8bd;
      font-size: 13px;
      font-weight: 400;
    }

    .section-title {
      color: #dce7f7;
      font-size: 14px;
      font-weight: 700;
      margin: 18px 0 10px;
    }

    .probabilities,
    .odds-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .prob,
    .odd {
      border-radius: 11px;
      padding: 13px 3px;
      text-align: center;
      min-width: 0;
    }

    .prob {
      background: #0b1020;
    }

    .odd {
      background: #27354a;
      border: 1px solid #40516a;
    }

    .prob span,
    .odd span {
      display: block;
      margin-bottom: 7px;
      color: #dce7f7;
      font-size: 13px;
    }

    .prob strong {
      display: block;
      color: #5dbbff;
      font-size: clamp(16px, 5vw, 23px);
    }

    .odd strong {
      display: block;
      color: #ffd37a;
      font-size: 20px;
    }

    .bookmaker {
      color: #aebad0;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 10px;
      text-align: center;
    }

    .comparison {
      background: #101b2d;
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
    }

    .comparison-row {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 6px;
      align-items: center;
      padding: 7px 0;
      font-size: 12px;
    }

    .comparison-row strong {
      font-variant-numeric: tabular-nums;
    }

    .positive {
      color: #71d9ac;
    }

    .negative {
      color: #ff9a9a;
    }

    .small {
      font-size: 12px;
      color: #aebad0;
      line-height: 1.5;
    }

    .notice {
      margin-top: 20px;
      color: #ffca55;
      line-height: 1.6;
      font-size: 13px;
    }

    .status {
      color: #aebad0;
      line-height: 1.6;
    }

    .updated {
      font-size: 12px;
      color: #aebad0;
      margin-top: 8px;
    }

    .empty {
      background: #151e30;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: #aebad0;
      line-height: 1.6;
    }

    .count {
      color: #aebad0;
      font-size: 13px;
      margin: 12px 0;
    }

    footer {
      text-align: center;
      margin-top: 35px;
      color: #738198;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>🏆 AI SPORTS PREDICTOR</h1>
      <p class="subtitle">
        Inteligentna analiza sportowa
      </p>
    </header>

    <div class="sports">

      <button class="sport active"
        onclick="showSport('football', this)">
        ⚽ Piłka nożna
      </button>

      <button class="sport"
        onclick="showSport('volleyball', this)">
        🏐 Siatkówka
      </button>

      <button class="sport"
        onclick="showSport('basketball', this)">
        🏀 Koszykówka
      </button>

      <button class="sport"
        onclick="showSport('tennis', this)">
        🎾 Tenis
      </button>

    </div>

    <section class="panel" id="content">
      <h2>⚽ Prognozy piłkarskie</h2>
      <p class="status">Ładowanie prognoz...</p>
    </section>

    <footer>
      AI Sports Predictor • Model eksperymentalny
    </footer>

  </div>

  <script>
    const content = document.getElementById("content");

    let footballData = null;
    let selectedLeague = "ALL";
    let searchText = "";
    let onlyWithOdds = false;
    let activeSport = "football";

    const sportNames = {
      volleyball: "🏐 Siatkówka",
      basketball: "🏀 Koszykówka",
      tennis: "🎾 Tenis"
    };

    const leagueNames = {
      PL: "Premier League",
      PD: "La Liga",
      BL1: "Bundesliga",
      SA: "Serie A",
      FL1: "Ligue 1",
      DED: "Eredivisie",
      PPL: "Primeira Liga",
      ELC: "Championship",
      BSA: "Brazilian Serie A",
      CL: "Champions League",
      WC: "World Cup",
      EC: "European Championship"
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]
      );
    }

    function formatDate(value) {
      if (!value) return "Brak daty";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "Data nieznana";
      }

      return date.toLocaleString("pl-PL", {
        timeZone: "Europe/Warsaw",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function percentage(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "–";
      }

      const number = Number(value);

      return Number.isFinite(number)
        ? number.toFixed(1).replace(".", ",") + "%"
        : "–";
    }

    function formatOdd(value) {
      const number = Number(value);

      return Number.isFinite(number) && number > 1
        ? number.toFixed(2).replace(".", ",")
        : "–";
    }

    function validOdds(odds) {
      if (!odds || typeof odds !== "object") {
        return false;
      }

      return ["home", "draw", "away"].every(key => {
        const value = Number(odds[key]);

        return odds[key] !== null &&
          odds[key] !== undefined &&
          odds[key] !== "" &&
          Number.isFinite(value) &&
          value > 1;
      });
    }

    function getLeagueCode(match, data) {
      const candidates = [
        match.competition_code,
        match.league_code,
        match.competition,
        match.league
      ];

      for (const value of candidates) {
        if (value && typeof value === "object") {
          const code = value.code || value.id;

          if (code) {
            return String(code);
          }

          if (value.name) {
            candidates.push(value.name);
          }

          continue;
        }

        if (!value) continue;

        const text = String(value).trim();

        if (leagueNames[text]) {
          return text;
        }

        const knownCode = Object.keys(leagueNames).find(
          code =>
            leagueNames[code].toLowerCase() ===
            text.toLowerCase()
        );

        if (knownCode) {
          return knownCode;
        }

        return text;
      }

      if (data.competition_code) {
        return String(data.competition_code);
      }

      if (data.competition) {
        const name = String(data.competition);

        const code = Object.keys(leagueNames).find(
          key =>
            leagueNames[key].toLowerCase() ===
            name.toLowerCase()
        );

        return code || name;
      }

      return "Nieznana liga";
    }

    function getLeagueName(code) {
      return leagueNames[code] || code;
    }

    function renderComparison(probabilities, odds) {
      if (!validOdds(odds)) return "";

      const keys = [
        ["home", "1"],
        ["draw", "X"],
        ["away", "2"]
      ];

      const total = keys.reduce(
        (sum, [key]) => sum + 1 / Number(odds[key]),
        0
      );

      if (total <= 0) return "";

      const rows = keys.map(([key, label]) => {
        const raw = probabilities[key];

        if (
          raw === null ||
          raw === undefined ||
          raw === ""
        ) {
          return "";
        }

        const ai = Number(raw);

        if (!Number.isFinite(ai)) return "";

        const market =
          (1 / Number(odds[key])) / total * 100;

        const difference = ai - market;

        const sign = difference > 0 ? "+" : "";

        const cssClass = difference >= 0
          ? "positive"
          : "negative";

        return `
          <div class="comparison-row">
            <strong>${label}</strong>
            <span>
              AI ${percentage(ai)}
              · rynek ${percentage(market)}
            </span>
            <strong class="${cssClass}">
              ${sign}${percentage(difference)}
            </strong>
          </div>
        `;
      }).join("");

      if (!rows.trim()) return "";

      return `
        <div class="comparison">
          <div class="section-title"
            style="margin-top:0">
            📊 AI kontra rynek
          </div>

          ${rows}

          <p class="small">
            Różnica w punktach procentowych.
            Prawdopodobieństwa rynku
            znormalizowano po usunięciu marży.
            Dodatnia różnica nie oznacza
            gwarantowanego zysku.
          </p>
        </div>
      `;
    }

    function renderOdds(match) {
      const odds = match.odds;

      if (!validOdds(odds)) {
        return `
          <p class="small">
            Kursy bukmacherskie obecnie niedostępne.
          </p>
        `;
      }

      return `
        <div class="section-title">
          💰 Kursy bukmacherskie
        </div>

        <div class="odds-grid">
          <div class="odd">
            <span>1</span>
            <strong>${formatOdd(odds.home)}</strong>
          </div>

          <div class="odd">
            <span>X</span>
            <strong>${formatOdd(odds.draw)}</strong>
          </div>

          <div class="odd">
            <span>2</span>
            <strong>${formatOdd(odds.away)}</strong>
          </div>
        </div>

        <div class="bookmaker">
          Bukmacher:
          ${escapeHTML(odds.bookmaker || "Nieznany")}

          ${odds.updated_at
            ? `
              <div>
                Aktualizacja kursów:
                ${escapeHTML(
                  formatDate(odds.updated_at)
                )}
              </div>
            `
            : ""}
        </div>

        ${renderComparison(
          match.probabilities || {},
          odds
        )}
      `;
    }

    function renderMatch(match) {
      const p = match.probabilities || {};

      const league = getLeagueName(
        match._leagueCode
      );

      return `
        <article class="match">

          <div class="league-label">
            🏆 ${escapeHTML(league)}
          </div>

          <div class="date">
            ${escapeHTML(formatDate(match.date))}
          </div>

          <div class="teams">
            ${escapeHTML(
              match.home_team || "Gospodarze"
            )}

            <div class="vs">VS</div>

            ${escapeHTML(
              match.away_team || "Goście"
            )}
          </div>

          <div class="section-title">
            🤖 Prawdopodobieństwo AI
          </div>

          <div class="probabilities">

            <div class="prob">
              <span>1</span>
              <strong>${percentage(p.home)}</strong>
            </div>

            <div class="prob">
              <span>X</span>
              <strong>${percentage(p.draw)}</strong>
            </div>

            <div class="prob">
              <span>2</span>
              <strong>${percentage(p.away)}</strong>
            </div>

          </div>

          ${renderOdds(match)}

        </article>
      `;
    }

    function getMatches() {
      if (!footballData) return [];

      return footballData.predictions.map(match => ({
        ...match,
        _leagueCode: getLeagueCode(
          match,
          footballData
        )
      }));
    }

    function renderFootball() {
      if (!footballData) return;

      const allMatches = getMatches();

      const leagues = [...new Set(
        allMatches.map(match => match._leagueCode)
      )].sort((a, b) =>
        getLeagueName(a).localeCompare(
          getLeagueName(b),
          "pl"
        )
      );

      const oddsCount = allMatches.filter(
        match => validOdds(match.odds)
      ).length;

      const options = leagues.map(code => `
        <option value="${escapeHTML(code)}"
          ${selectedLeague === code ? "selected" : ""}>
          ${escapeHTML(getLeagueName(code))}
        </option>
      `).join("");

      content.innerHTML = `
        <h2>⚽ Wszystkie ligi</h2>

        <p class="muted">
          Model:
          ${escapeHTML(
            footballData.model || "AI"
          )}
        </p>

        <p class="updated">
          Aktualizacja danych:
          ${escapeHTML(
            formatDate(footballData.updated_at)
          )}
        </p>

        <div class="summary">

          <div class="summary-box">
            <strong>${allMatches.length}</strong>
            <span>Prognozowane mecze</span>
          </div>

          <div class="summary-box">
            <strong>${leagues.length}</strong>
            <span>Dostępne ligi</span>
          </div>

          <div class="summary-box">
            <strong>${oddsCount}</strong>
            <span>Mecze z kursami</span>
          </div>

          <div class="summary-box">
            <strong id="visibleCount">0</strong>
            <span>Widoczne mecze</span>
          </div>

        </div>

        <div class="filters">

          <label for="leagueSelect">
            🏆 Wybierz ligę
          </label>

          <select id="leagueSelect">
            <option value="ALL">
              Wszystkie ligi
            </option>
            ${options}
          </select>

          <label for="matchSearch">
            🔎 Szukaj drużyny
          </label>

          <input
            id="matchSearch"
            type="search"
            placeholder="Np. Chelsea, Barcelona..."
          >

          <label class="check-row">
            <input
              id="oddsOnly"
              type="checkbox"
            >
            Pokaż tylko mecze z kursami
          </label>

        </div>

        <p class="count" id="matchCount"></p>

        <div id="matchesList"></div>

        <p class="notice">
          ⚠️ Prognozy są eksperymentalne.
          Nie stanowią gwarancji wyniku
          ani rekomendacji zakładów.
          Kursy mogą się zmieniać.
        </p>
      `;

      const leagueSelect =
        document.getElementById("leagueSelect");

      const matchSearch =
        document.getElementById("matchSearch");

      const oddsOnly =
        document.getElementById("oddsOnly");

      leagueSelect.value = selectedLeague;
      matchSearch.value = searchText;
      oddsOnly.checked = onlyWithOdds;

      leagueSelect.addEventListener(
        "change",
        event => {
          selectedLeague = event.target.value;
          updateMatches();
        }
      );

      matchSearch.addEventListener(
        "input",
        event => {
          searchText = event.target.value;
          updateMatches();
        }
      );

      oddsOnly.addEventListener(
        "change",
        event => {
          onlyWithOdds = event.target.checked;
          updateMatches();
        }
      );

      updateMatches();
    }

    function updateMatches() {
      if (!footballData) return;

      let matches = getMatches();

      if (selectedLeague !== "ALL") {
        matches = matches.filter(
          match =>
            match._leagueCode === selectedLeague
        );
      }

      if (searchText.trim()) {
        const query = searchText
          .trim()
          .toLocaleLowerCase("pl");

        matches = matches.filter(match => {
          const text = [
            match.home_team || "",
            match.away_team || "",
            getLeagueName(match._leagueCode)
          ].join(" ").toLocaleLowerCase("pl");

          return text.includes(query);
        });
      }

      if (onlyWithOdds) {
        matches = matches.filter(
          match => validOdds(match.odds)
        );
      }

      matches.sort((a, b) => {
        const dateA = new Date(a.date).getTime();
        const dateB = new Date(b.date).getTime();

        const safeA = Number.isFinite(dateA)
          ? dateA
          : Number.MAX_SAFE_INTEGER;

        const safeB = Number.isFinite(dateB)
          ? dateB
          : Number.MAX_SAFE_INTEGER;

        return safeA - safeB;
      });

      document.getElementById(
        "visibleCount"
      ).textContent = matches.length;

      document.getElementById(
        "matchCount"
      ).textContent =
        "Wyświetlane mecze: " + matches.length;

      const list = document.getElementById(
        "matchesList"
      );

      if (!matches.length) {
        list.innerHTML = `
          <div class="empty">
            Nie znaleziono meczów
            spełniających wybrane filtry.
          </div>
        `;
        return;
      }

      list.innerHTML = matches.map(
        renderMatch
      ).join("");
    }

    async function loadFootball() {
      activeSport = "football";

      content.innerHTML = `
        <h2>⚽ Prognozy piłkarskie</h2>
        <p class="status">
          Ładowanie prognoz...
        </p>
      `;

      try {
        const response = await fetch(
          "./predictions.json?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            "Nie można pobrać prognoz"
          );
        }

        const data = await response.json();

        if (!Array.isArray(data.predictions)) {
          throw new Error(
            "Nieprawidłowy format danych"
          );
        }

        footballData = data;

        if (activeSport === "football") {
          renderFootball();
        }

      } catch (error) {
        if (activeSport !== "football") return;

        content.innerHTML = `
          <h2>⚽ Prognozy piłkarskie</h2>

          <p class="status">
            Nie udało się pobrać prognoz.
            Spróbuj odświeżyć aplikację później.
          </p>
        `;
      }
    }

    function showSport(sport, button) {
      activeSport = sport;

      document.querySelectorAll(
        ".sport"
      ).forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");

      if (sport === "football") {
        if (footballData) {
          renderFootball();
        } else {
          loadFootball();
        }
        return;
      }

      content.innerHTML = `
        <h2>
          ${escapeHTML(
            sportNames[sport] || "Sport"
          )}
        </h2>

        <p class="status">
          Przygotowujemy model i źródła danych
          dla tej dyscypliny.
        </p>
      `;
    }

    loadFootball();
  </script>
</body>
</html>
